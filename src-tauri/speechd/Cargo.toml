[package]
name = "speechd"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Local Speechmatics-RT-protocol speech endpoint for the Circle native shell"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
