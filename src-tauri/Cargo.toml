[package]
name = "circle"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Co-Intelligence Circle — native shell"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
speechd = { path = "speechd" }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
