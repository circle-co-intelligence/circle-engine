# trystero signaling broker — websockets only, behind Caddy TLS.
# Anonymous read/write is correct here: trystero payloads are already
# E2EE'd over DC; the broker only shuttles opaque SDP/signaling blobs.
listener 8080
protocol websockets
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# signaling topics are high-churn small payloads — cap resource use
max_queued_messages 1000
max_inflight_messages 100
