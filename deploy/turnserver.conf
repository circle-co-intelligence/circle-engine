# coturn — STUN/TURN for peers behind restrictive NAT.
# static-auth-secret model: clients get time-limited TURN creds from
# /api/ice (or VITE_CIC_TURN), never the shared secret itself.
realm=${REALM}
use-auth-secret
static-auth-secret=${TURN_SECRET}
fingerprint
lt-cred-mech
no-multicast-peers
no-cli
log=stdout
min-port=49152
max-port=49252
