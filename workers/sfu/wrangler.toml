name = "cic-sfu"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# pinned: all circle-engine resources live on the regenleadership account
account_id = "cf1f279501abeda01c1260a60cf95f5f"

# MeterBus DO (defined in cic-ai-gateway) — funding gate on sessions/new:
# paid lanes need a covering pool (sponsor → account → room). Unbound →
# gate off (self-host default).
[[durable_objects.bindings]]
name = "METER"
class_name = "MeterBus"
script_name = "cic-ai-gateway"
workers_dev = true

# Secrets: wrangler secret put CALLS_APP_SECRET
#          wrangler secret put METER_TOKEN  — 'probe' role (scripts/meter-acl.mjs)
# Vars:    CALLS_APP_ID — set below once the Realtime app exists
[vars]
CALLS_APP_ID = "237632325fc14b780eaadaa47547edf5"
