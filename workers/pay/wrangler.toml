name = "cic-pay"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# pinned: all circle-engine resources live on the regenleadership account
account_id = "cf1f279501abeda01c1260a60cf95f5f"

# MeterBus DO lives in cic-ai-gateway — bind by script name so room pools,
# account wallets, grant nonces and billing records share one ledger.
[[durable_objects.bindings]]
name = "METER"
class_name = "MeterBus"
script_name = "cic-ai-gateway"

# cic-pay → cic-pay-hook — service binding, not a URL fetch: worker→worker
# fetches on workers.dev within one account are rejected (error 1042).
[[services]]
binding = "PAY_HOOK"
service = "cic-pay-hook"

# NO Stripe secrets on this worker — by design.
# Checkout = Payment-Link URL assembly (client_reference_id binds the
# settlement target). Portal + webhook are forwarded verbatim to
# cic-pay-hook, the only worker holding Stripe secrets (read-only rk_ +
# whsec_). A compromised cic-pay cannot charge cards or mint sessions.
#
# Vars (set here or via `wrangler deploy --var`):
#   APP_ORIGIN    — site origin, e.g. https://circle-engine-7ny.pages.dev
#   PAY_HOOK_URL  — https://cic-pay-hook.regenleadership.workers.dev
#   PAY_PACKAGES  — JSON array of one-time credit packs with Payment Links:
#                   [{"id":"pack8k","label":"8,000 seconds","seconds":8000,
#                     "priceId":"price_…","paymentLink":"https://buy.stripe.com/…",
#                     "amountCents":500,"currency":"usd"}]
#   PAY_SUB       — JSON monthly plan:
#                   {"priceId":"price_…","paymentLink":"https://buy.stripe.com/…",
#                    "seconds":20000,"label":"Circle Pro",
#                    "amountCents":800,"currency":"usd"}
#
# Secrets (`wrangler secret put` — never commit):
#   METER_TOKEN — 'admin' role token for MeterBus (scripts/meter-acl.mjs)
