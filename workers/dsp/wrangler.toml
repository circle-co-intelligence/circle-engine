name = "cic-dsp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# pinned: all circle-engine resources live on the regenleadership account
account_id = "cf1f279501abeda01c1260a60cf95f5f"

# Edge-side audio enhancement for paid, opted-in rooms.
# Cloudflare Realtime Media Transport Adapters POST adapters/new against the
# Calls API pointing at this worker's wss endpoint; the adapter pushes PCM
# audio and ingests our processed PCM back as a republished track.
#
# PRIVACY: this lane carries PLAINTEXT audio — it is only ever attached when
# the participant explicitly opted in (client shows a visible
# "edge-processed, not E2EE" badge). Nothing is persisted.

[[durable_objects.bindings]]
name = "DSP"
class_name = "DspBus"

# MeterBus DO (defined in cic-ai-gateway) — funding gate on the paid
# speech/edge lanes: /speech + /speech-token need a covering pool, and the
# relay debits streamed seconds continuously. Unbound → gate off.
[[durable_objects.bindings]]
name = "METER"
class_name = "MeterBus"
script_name = "cic-ai-gateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DspBus"]
