name = "cic-ai-gateway"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# pinned: all circle-engine resources live on the regenleadership account
account_id = "cf1f279501abeda01c1260a60cf95f5f"

# Workers AI binding — the default provider; other providers set AI_PROVIDER
# + AI_API_KEY (wrangler secret put). ZDR: pick upstreams with zero-retention
# terms; this worker itself persists nothing.
[ai]
binding = "AI"

# AI_CHAT_MODEL / AI_STT_MODEL / AI_TTS_MODEL — optional model overrides
# AI_BASE_URL — optional upstream base override (OpenAI-compatible)

# MeterBus DO — metered paid pools, one instance per room ({balance,spent}
# in KV storage; single-threaded → atomic debits by construction). The
# '__grants__' instance stores redeemed grant nonces (replay guard).
#
# Ledger trust boundary (see docs/SECURITY.md):
#   METER_TOKEN — this worker's 'spend' role token (wrangler secret put)
#   METER_ACL   — JSON {sha256(token): 'admin'|'spend'|'probe'}; when set,
#                 DO ops require a known token AND wallet debits/transfers
#                 require a client-signed auth, a sponsored-room record, or
#                 a matching credit — a compromised worker can't drain wallets.
#                 Generate both via `node scripts/meter-acl.mjs`.
[[durable_objects.bindings]]
name = "METER"
class_name = "MeterBus"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MeterBus"]

# Top-ups: GRANT_PUBKEY (Ed25519 hex, wrangler secret put) verifies grants
# minted by scripts/grant.mjs after a payment settles — any rail works.

# Analytics Engine — opt-in anonymous quality telemetry (/ai/telemetry):
# [[analytics_engine_datasets]]
# binding = "AE"
# dataset = "cic_quality"

# Turnstile — abuse protection on paid lanes (secret via wrangler secret put):
#   TURNSTILE_SECRET — unset = gate off

# Model byte lanes (/ai/hf, /ai/ort, /ai/pack) — pay-before-serve:
#   MODELS_BASE set (production) → 302 to the free-egress bucket; the worker
#     never serves model bytes. Provision via scripts/models-to-r2.sh.
#   MODELS_BASE unset + METER bound → proxies only for a funded room
#     (room in path prefix or ?room=); unfunded → 402.
#   METER unbound → self-host mode, proxies unconditionally.
# [vars]
# MODELS_BASE = "https://pub-<hash>.r2.dev"  # or the models custom domain
