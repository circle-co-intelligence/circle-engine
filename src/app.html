<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Co-Intelligence Circle</title>
		<meta name="description" content="Guided talking-stick circles with human and AI participants and a shared fire." />
		<meta name="theme-color" content="#1ABC9C" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/brand/symbol-light.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta property="og:title" content="Co-Intelligence Circle" />
		<meta property="og:description" content="Guided talking-stick circles with human and AI participants and a shared fire." />
		<meta property="og:image" content="%sveltekit.assets%/og.png" />
		<!-- Fonts self-hosted only — third-party font/CDN links leak participant IPs
		     before they enter the circle. No third-party analytics in this shell. -->
		<!-- Static hosts (GH Pages) can't send COOP/COEP — a tiny service worker
		     restores cross-origin isolation so SharedArrayBuffer (multi-threaded
		     wllama) works there. No-ops where the headers already exist. -->
		<script src="%sveltekit.assets%/coi-serviceworker.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
